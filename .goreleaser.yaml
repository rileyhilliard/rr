version: 2
project_name: rr

builds:
  - main: ./cmd/rr
    binary: rr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

homebrew_casks:
  - name: rr
    binaries:
      - rr
    homepage: https://github.com/rileyhilliard/rr
    description: Sync code and run commands on remote machines
    repository:
      owner: rileyhilliard
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Homebrew deprecated `postflight` blocks, which is what `hooks.post.install`
    # renders, so the quarantine strip goes in as a `postflight_steps` block.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "rr"], chdir: ".", writable_paths: ["rr"]
        end
      end
